[package]
name = "tauri-plugin-web-auth"
version = "0.1.0"
description = "Runs OAuth sign-in in the platform's own browser sheet instead of the app webview"
edition = "2021"
rust-version = "1.77.2"
# Required for Tauri plugins that ship mobile (Swift/Kotlin) code and permissions.
links = "tauri-plugin-web-auth"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
